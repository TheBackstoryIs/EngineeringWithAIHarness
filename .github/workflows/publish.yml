name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Confirm tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"

      - name: Verify public source and package boundaries
        run: |
          test -f src/runtime/tree-sitter-index.mjs
          npm run publication:check

      - name: Run checks
        run: npm run check

      - name: Install browser used by operational UI tests
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Enforce focused Team Hub coverage
        run: npm run test:team-hub:coverage

      - name: Inspect package
        run: npm pack --dry-run

      - name: Select npm release channel
        id: release-channel
        run: echo "tag=$(node scripts/publish-tag.mjs)" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: npm publish --tag "${{ steps.release-channel.outputs.tag }}"
